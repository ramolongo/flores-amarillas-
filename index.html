<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flores amarillas para ti 🌻</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;600&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:#493000;background:radial-gradient(circle at 50% 15%,#fffef1,#fff1a5 50%,#e7bd35);overflow-x:hidden}.scene{min-height:100vh;display:grid;place-items:center;padding:25px;position:relative;overflow:hidden}.glow{position:absolute;width:70vmin;height:70vmin;border-radius:50%;background:#fff6a6;filter:blur(55px);opacity:.7;animation:p 5s infinite}.card{z-index:4;width:min(760px,94vw);padding:40px 28px;text-align:center;border-radius:32px;background:#ffffff66;border:1px solid #fff9;backdrop-filter:blur(14px);box-shadow:0 25px 70px #7049002b}h1{font:5rem/1 "DM Serif Display";color:#8a5a00;margin:0;font-size:clamp(2.7rem,8vw,5rem)}.subtitle{font-size:clamp(1rem,2.7vw,1.2rem)}.message{min-height:100px;margin:25px auto;font:clamp(1.35rem,4vw,2rem)/1.35 "DM Serif Display";transition:.35s}.hide{opacity:0;transform:translateY(10px)}button{border:0;border-radius:99px;padding:14px 24px;background:#8a5a00;color:#fff;font:600 1rem Poppins;cursor:pointer;box-shadow:0 8px 20px #8a5a0040;margin:5px}.small{opacity:.65;font-size:.82rem;margin-top:14px}.hidden{display:none!important}
.flower{position:absolute;bottom:-35px;width:var(--s);height:calc(var(--s)*1.4);transform-origin:bottom;animation:sway var(--speed) ease-in-out infinite alternate}.flower .stem{position:absolute;bottom:0;left:50%;height:75%;width:7px;background:#438345;border-radius:9px}.head{position:absolute;top:0;left:50%;width:75%;aspect-ratio:1;transform:translateX(-50%);animation:bloom 4s infinite}.petal{position:absolute;left:50%;top:50%;width:43%;height:70%;border-radius:55%;background:radial-gradient(circle at 50% 15%,#fff37b,#ffd43b 60%,#e8a300);transform-origin:50% 100%}.petal:nth-child(1){transform:translate(-50%,-100%) rotate(0)}.petal:nth-child(2){transform:translate(-50%,-100%) rotate(45deg)}.petal:nth-child(3){transform:translate(-50%,-100%) rotate(90deg)}.petal:nth-child(4){transform:translate(-50%,-100%) rotate(135deg)}.petal:nth-child(5){transform:translate(-50%,-100%) rotate(180deg)}.petal:nth-child(6){transform:translate(-50%,-100%) rotate(225deg)}.petal:nth-child(7){transform:translate(-50%,-100%) rotate(270deg)}.petal:nth-child(8){transform:translate(-50%,-100%) rotate(315deg)}.center{position:absolute;left:50%;top:50%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#805000}.f1{left:3%;--s:140px;--speed:4s}.f2{left:18%;--s:105px;--speed:3.5s}.f3{right:16%;--s:120px;--speed:4.4s}.f4{right:2%;--s:150px;--speed:3.8s}@keyframes sway{to{transform:rotate(6deg)}}@keyframes bloom{50%{transform:translateX(-50%) scale(1.05)}}@keyframes p{50%{transform:scale(1.12)}}@keyframes catOffer{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.surprise{z-index:4;width:min(900px,96vw);text-align:center}.surprise h2{font:clamp(2.4rem,7vw,4.5rem) "DM Serif Display";color:#8a5a00;margin:0 0 10px}.realcat{position:absolute;animation:catOffer 3.2s ease-in-out infinite}width:min(250px,58vw);height:310px;object-fit:cover;object-position:center;border-radius:28px;box-shadow:0 18px 40px #70490030;opacity:.96}.catbox{position:relative;margin:15px auto;width:min(420px,90vw);height:350px;display:flex;align-items:flex-end;justify-content:center}.cat{display:none;position:relative;width:230px;height:280px;animation:bob 2s ease-in-out infinite}.ear{position:absolute;top:5px;width:75px;height:85px;background:#d98f55;border-radius:55% 45% 15% 15%;transform:rotate(-25deg);z-index:1}.ear.r{right:8px;transform:rotate(25deg)}.head{position:absolute;top:25px;left:28px;width:175px;height:150px;background:#f0a76a;border-radius:48% 48% 45% 45%;z-index:2}.eye{position:absolute;top:72px;width:22px;height:28px;background:#2b190b;border-radius:50%}.eye.l{left:48px}.eye.r{right:48px}.eye:after{content:'';position:absolute;width:6px;height:8px;background:white;border-radius:50%;left:4px;top:4px}.nose{position:absolute;left:79px;top:102px;width:17px;height:12px;border-radius:50%;background:#df6380}.mouth{position:absolute;left:82px;top:115px;width:20px;height:12px;border-bottom:3px solid #5d2a1b;border-radius:50%}.body{position:absolute;left:50px;bottom:0;width:135px;height:150px;background:#d7894e;border-radius:55px 55px 30px 30px}.arm{position:absolute;top:105px;left:25px;width:120px;height:27px;background:#d7894e;border-radius:20px;transform-origin:20px 50%;animation:reach 3s ease-in-out infinite}.paw{position:absolute;right:-12px;top:-3px;width:35px;height:35px;border-radius:50%;background:#e6a06a}.bouquet{position:absolute;right:-5px;top:55px;width:125px;height:130px;z-index:5;transform:rotate(-12deg);animation:bouquet 3s ease-in-out infinite}.wrap{position:absolute;bottom:0;left:38px;width:65px;height:80px;background:#b87939;clip-path:polygon(15% 0,90% 12%,100% 100%,0 100%)}.flowerMini{position:absolute;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#704000 0 16%,transparent 17%),conic-gradient(#ffd43b 0 12%,transparent 12% 25%,#ffd43b 25% 37%,transparent 37% 50%,#ffd43b 50% 62%,transparent 62% 75%,#ffd43b 75% 87%,transparent 87%);animation:spin 5s linear infinite}.fm1{left:5px;top:15px}.fm2{left:40px;top:0}.fm3{left:65px;top:30px}@keyframes reach{0%,100%{transform:rotate(18deg)}45%,70%{transform:rotate(-20deg)}}@keyframes bouquet{0%,100%{transform:rotate(-12deg) translateY(0)}50%{transform:rotate(-18deg) translateY(-8px)}}@keyframes bob{50%{transform:translateY(-5px)}}@keyframes spin{to{transform:rotate(360deg)}}.speech{background:#fffaf0dd;border:1px solid #fff;border-radius:25px;padding:24px;box-shadow:0 15px 45px #70490020;font:clamp(1.15rem,3vw,1.55rem)/1.6 "DM Serif Display";max-width:700px;margin:auto}.heart{display:inline-block;animation:beat 1s infinite}@keyframes beat{50%{transform:scale(1.25)}}@media(max-width:600px){.flower{--s:85px}.catbox{height:310px}.cat{transform:scale(.82);transform-origin:bottom center}}
</style></head><body><main class="scene">
<div class="glow"></div><div class="flower f1"><div class="stem"></div><div class="head"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div></div><div class="flower f2"><div class="stem"></div><div class="head"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div></div><div class="flower f3"><div class="stem"></div><div class="head"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div></div><div class="flower f4"><div class="stem"></div><div class="head"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div></div>
<section id="messages" class="card"><h1>Flores amarillas para ti</h1><p class="subtitle">Porque hay personas que merecen un pequeño pedacito de sol en forma de flores.</p><div id="msg" class="message"></div><button id="next">Ver otro mensaje</button><button id="surpriseBtn" class="hidden">Tengo una sorpresa para ti 🌻</button><div class="small">21 de septiembre · hecho especialmente para ti</div></section>
<section id="surprise" class="surprise hidden"><h2>¡Tengo algo más para ti!</h2><div class="catbox"><img class="realcat" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cat_in_flowers_(290913173).jpg" alt="Gatito entre flores"><div class="cat"><div class="ear"></div><div class="ear r"></div><div class="head"><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="mouth"></div></div><div class="body"></div><div class="arm"><div class="paw"></div></div><div class="bouquet"><i class="flowerMini fm1"></i><i class="flowerMini fm2"></i><i class="flowerMini fm3"></i><div class="wrap"></div></div></div></div><div class="speech" id="speech"></div><p class="credit">Imagen del gato: Wikimedia Commons, CC BY 2.0.</p><button id="restart">Volver a ver las flores 🌻</button></section>
</main><script>
const messages=["Que estas flores iluminen tu día y te recuerden lo especial que eres.","Así como el sol ilumina las flores, tú haces más bonito cada día.","Un pequeño detalle para alguien que merece cosas bonitas todos los días.","Que nunca te falten motivos para sonreír, sueños por cumplir y flores que te recuerden lo mucho que vales.","Hoy las flores son amarillas, pero la razón de sonreír eres tú."];
const msg=document.querySelector("#msg"),next=document.querySelector("#next");let i=0;msg.textContent="“"+messages[0]+"”";
const surpriseBtn=document.querySelector("#surpriseBtn");next.onclick=()=>{if(i<messages.length-1){msg.classList.add("hide");setTimeout(()=>{i++;msg.textContent="“"+messages[i]+"”";msg.classList.remove("hide");if(i===messages.length-1){next.classList.add("hidden");surpriseBtn.classList.remove("hidden")}},300)}};surpriseBtn.onclick=showSurprise;
function showSurprise(){document.querySelector("#messages").classList.add("hidden");document.querySelector("#surprise").classList.remove("hidden");speak()}
const speech=document.querySelector("#speech"),lines=["¡Hola! 🐱","Quería darte estas flores amarillas porque quería decirte algo que sale del corazón.","Muchas gracias por estar conmigo, por tu apoyo, por tus consejos y por cada momento que compartimos.","Gracias por hacer mis días más bonitos, por las sonrisas, por escucharme y por creer en mí.","Espero poder seguir compartiendo muchísimos momentos contigo. Eres una persona muy especial para mí.","Gracias por estar conmigo. <span class='heart'>💛</span>"];
function speak(){let n=0;speech.innerHTML=lines[0];const timer=setInterval(()=>{n++;if(n>=lines.length){clearInterval(timer);return}speech.innerHTML=lines[n]},8000)}
document.querySelector("#restart").onclick=()=>location.reload();
</script></body></html>
